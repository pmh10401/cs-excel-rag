name: Windows package and optional grounding model

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            windows-demo/requirements.txt
            requirements-claim-verification.txt
      - name: Install base and optional model dependencies
        run: python -m pip install -r windows-demo/requirements.txt -r requirements-claim-verification.txt
      - name: Prepare example configuration
        run: Copy-Item windows-demo/config.example.json windows-demo/config.json
      - name: Offline regression
        run: python windows-demo/test_demo.py
      - name: Independent extracted package
        run: python package_windows.py
      - name: Prepare pinned model
        run: python -m ragkit.claim_verification --prepare
      - name: CPU health examples
        run: python -m ragkit.claim_verification --check
